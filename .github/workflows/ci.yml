name: Linting

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22, 24, 26]

    steps:
      - uses: actions/checkout@v7
      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.9
        with:
          version: 10.26.0
          run_install: false

      - name: Use Node.js ${{ matrix.node-version }} 🏗
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Get pnpm store directory 📦
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - uses: actions/cache@v6
        name: Setup pnpm cache 📦
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml', '**/eslint.config.js') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies 👨🏻‍💻
        run: pnpm install --frozen-lockfile

      - name: Lint 👀
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Run build 👷
        run: pnpm run build

      - name: Run tests 🧪
        run: pnpm run test:cov

      - name: Check packed package
        run: pnpm run test:package

  consumers:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [12.20.0, 14.13.0, 18, 20]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.0.9
        with:
          version: 10.26.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Save development runtime
        run: echo "DEV_NODE=$(command -v node)" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - name: Check consumer runtime with development tooling
        run: '"$DEV_NODE" scripts/check-package.ts "$(command -v node)"'
